[package]
name = "badge-farm"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
discord_client_gateway = { git = "https://github.com/prismillon/discord-client-rs", rev = "a6d67fb4d44deb55c4fd38c6faae73db1ad26e5d" }
discord_client_rest = { git = "https://github.com/prismillon/discord-client-rs", rev = "a6d67fb4d44deb55c4fd38c6faae73db1ad26e5d" }
discord_client_structs = { git = "https://github.com/prismillon/discord-client-rs", rev = "a6d67fb4d44deb55c4fd38c6faae73db1ad26e5d" }
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.140"

[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
